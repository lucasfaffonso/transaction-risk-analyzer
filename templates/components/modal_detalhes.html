<div
  id="modal_detalhes"
  class="modal-overlay oculto"
  role="dialog"
  aria-modal="true"
  aria-labelledby="modal_detalhes_titulo"
>

  <div class="modal-card">

    <!-- CABEÇALHO -->

    <div class="modal-cabecalho">

      <div>

        <h3 id="modal_detalhes_titulo">
          Detalhes da transação
        </h3>

        <p id="modal_detalhes_subtitulo"></p>

      </div>


      <button
        type="button"
        id="fechar_modal_detalhes"
        class="botao-fechar-modal"
        aria-label="Fechar"
      >
        ×
      </button>

    </div>


    <!-- CONTEÚDO -->

    <div
      id="modal_detalhes_conteudo"
      class="modal-conteudo"
    ></div>

  </div>

</div>
