    </h3>

    <p class="texto-secundario">
      Visualize e gerencie as contas de lojistas cadastradas no sistema.
    </p>


    <div class="tabela-container">

      <table>

        <thead>

          <tr>
            <th>ID</th>
            <th>Nome</th>
            <th>Tipo</th>
            <th>Documento</th>
            <th>E-mail</th>
            <th>Telefone</th>
            <th>Cadastro</th>
            <th>Status</th>
            <th>Ação</th>
          </tr>

        </thead>


        <tbody id="admin_lista_usuarios"></tbody>

      </table>

    </div>


    <p

    </p>


    <p
