<section
  id="lojista_estatisticas"
  class="secao-painel oculto"
>

  <div class="card-dashboard">

    <h3>
      Estatísticas
    </h3>

    <p class="texto-secundario">
      Acompanhe os principais indicadores das transações analisadas.
    </p>


    <!-- RESULTADOS -->

    <div class="estatistica-secao">

      <h4>
        Resultados
      </h4>

      <div class="estatisticas-grid">

        <div class="estatistica-card">

          <span>
            Total
          </span>

          <strong id="lojista_est_total">
            0
          </strong>

        </div>


        <div class="estatistica-card">

          <span>
            Aprovadas
          </span>

          <strong id="lojista_est_aprovadas">
            0
          </strong>

        </div>


        <div class="estatistica-card">

          <span>
            Com alerta
          </span>

          <strong id="lojista_est_alerta">
            0
          </strong>

        </div>


        <div class="estatistica-card">

          <span>
            Em análise
          </span>

          <strong id="lojista_est_analise">
            0
          </strong>

        </div>


        <div class="estatistica-card">

          <span>
            Bloqueadas
          </span>

          <strong id="lojista_est_bloqueadas">
            0
          </strong>

        </div>

      </div>

    </div>


    <!-- NÍVEIS DE RISCO -->

    <div class="estatistica-secao">

      <h4>
        Níveis de risco
      </h4>

      <div class="estatisticas-grid">

        <div class="estatistica-card">

          <span>
            Baixo
          </span>

          <strong
            id="lojista_risco_baixo"
            class="risco-baixo"
          >
            0
          </strong>

        </div>


        <div class="estatistica-card">

          <span>
            Médio
          </span>

          <strong
            id="lojista_risco_medio"
            class="risco-medio"
          >
            0
          </strong>

        </div>


        <div class="estatistica-card">

          <span>
            Alto
          </span>

          <strong
            id="lojista_risco_alto"
            class="risco-alto"
          >
            0
          </strong>

        </div>


        <div class="estatistica-card">

          <span>
            Crítico
          </span>

          <strong
            id="lojista_risco_critico"
            class="risco-critico"
          >
            0
          </strong>

        </div>

      </div>

    </div>


    <!-- VALORES -->

    <div class="estatistica-secao">

      <h4>
        Valores
      </h4>

      <div class="estatisticas-grid">

        <div class="estatistica-card">

          <span>
            Valor total analisado
          </span>

          <strong id="lojista_valor_total">
            R$ 0,00
          </strong>

        </div>


        <div class="estatistica-card">

          <span>
            Ticket médio
          </span>

          <strong id="lojista_ticket_medio">
            R$ 0,00
          </strong>

        </div>


        <div class="estatistica-card">

          <span>
            Score médio
          </span>

          <strong id="lojista_score_medio">
            0
          </strong>

        </div>

      </div>

    </div>

  </div>

</section>
