<section
  id="lojista_analisar"
  class="secao-painel oculto"
>

  <div class="card-dashboard">

    <h3>
      Analisar transação
    </h3>

    <p class="texto-secundario">
      Informe primeiro o ID da transação para verificar se ela já foi analisada.
    </p>


    <form id="form_transacao">

      <!-- ETAPA 1: ID DA TRANSAÇÃO -->

      <div class="form-grid">

        <div class="campo campo-largo">

          <label for="pedido_id">
            ID da transação
          </label>

          <input
            type="text"
            id="pedido_id"
            maxlength="80"
            autocomplete="off"
            placeholder="Ex: TRX-1058"
          >

          <span
            class="erro"
            id="erro_pedido_id"
          ></span>

        </div>


        <div class="form-botao-largo">

          <button
            type="button"
            id="botao_verificar_pedido"
            class="botao-principal"
          >
            Verificar transação
          </button>

        </div>

      </div>


      <p
        id="mensagem_verificacao_pedido"
        class="mensagem"
      ></p>


      <!-- ETAPA 2: DADOS DA TRANSAÇÃO -->

      <div
        id="dados_transacao"
        class="oculto"
      >

        <div class="separador"></div>


        <div class="form-grid">

          <div class="campo campo-largo">

            <label for="comprador_nome">
              Nome do responsável
            </label>

            <input
              type="text"
              id="comprador_nome"
              maxlength="120"
              autocomplete="off"
              placeholder="Digite o nome do responsável"
            >

            <span
              class="erro"
              id="erro_comprador_nome"
            ></span>

          </div>


          <div class="campo">

            <label for="comprador_tipo_pessoa">
              Tipo de pessoa
            </label>

            <select id="comprador_tipo_pessoa">

              <option value="PF">
                Pessoa Física
              </option>

              <option value="PJ">
                Pessoa Jurídica
              </option>

            </select>

          </div>


          <div class="campo">

            <label
              for="comprador_documento"
              id="label_comprador_documento"
            >
              CPF
            </label>

            <input
              type="text"
              id="comprador_documento"
              maxlength="18"
              inputmode="numeric"
              autocomplete="off"
              placeholder="Digite o CPF"
            >

            <span
              class="erro"
              id="erro_comprador_documento"
            ></span>

          </div>


          <div class="campo">

            <label for="comprador_email">
              E-mail do responsável
            </label>

            <input
              type="email"
              id="comprador_email"
              maxlength="254"
              autocomplete="off"
              placeholder="Digite o e-mail"
            >

            <span
              class="erro"
              id="erro_comprador_email"
            ></span>

          </div>


          <div class="campo">

            <label for="transacao_valor">
              Valor da transação
            </label>

            <input
              type="number"
              id="transacao_valor"
              min="0.01"
              step="0.01"
              placeholder="0.00"
            >

            <span
              class="erro"
              id="erro_transacao_valor"
            ></span>

          </div>


          <div class="campo campo-largo">

            <label for="forma_pagamento">
              Forma de pagamento
            </label>

            <select id="forma_pagamento">

              <option value="CARTAO">
                Cartão
              </option>

              <option value="PIX">
                PIX
              </option>

              <option value="BOLETO">
                Boleto
              </option>

            </select>

          </div>


          <div class="form-botao-largo">

            <button
              type="submit"
              class="botao-principal"
            >
              Analisar transação
            </button>

          </div>

        </div>

      </div>

    </form>


    <p
      id="mensagem_analise"
      class="mensagem"
    ></p>


    <!-- RESULTADO -->

    <div
      id="resultado_analise"
      class="resultado-analise oculto"
    >

      <h4>
        Resultado da análise
      </h4>


      <div class="resultado-grid">

        <div class="resultado-item">

          <span>
            Pontuação
          </span>

          <strong id="resultado_pontuacao"></strong>

        </div>


        <div class="resultado-item">

          <span>
            Nível de risco
          </span>

          <strong id="resultado_risco"></strong>

        </div>


        <div class="resultado-item">

          <span>
            Status
          </span>

          <strong id="resultado_status"></strong>

        </div>

      </div>


      <div class="motivos-risco">

        <h4>
          Motivos
        </h4>

        <ul id="resultado_motivos"></ul>

      </div>

    </div>

  </div>

</section>
